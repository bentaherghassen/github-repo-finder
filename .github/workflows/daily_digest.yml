name: Daily Repository Discovery Digest

on:
  schedule:
    # Runs every day at 08:00 UTC (9:00 AM CET)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Deliver report via Gmail'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  discover-and-digest:
    name: Run Discovery & Deliver Digest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install -e .

      - name: Run test suite verification
        run: pytest

      - name: Run repository discovery workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          EMAIL_NOTIFICATIONS_ENABLED: ${{ github.event.inputs.send_email == 'false' && 'false' || 'true' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          RESULTS_PER_TOPIC: '10'
          REPORT_TOP_N: '5'
          REQUEST_DELAY: '1.0'
          LOG_LEVEL: 'INFO'
        run: |
          python main.py

      - name: Commit and push updated report & data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/repositories.json reports/latest.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(digest): update daily repository report [skip ci]"
            git push
          else
            echo "No changes detected in repository discovery outputs."
          fi

      - name: Upload reports as workflow artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-discovery-reports
          path: |
            data/repositories.json
            reports/latest.md
          retention-days: 30
