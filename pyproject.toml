[project]
name = "github-repo-finder"
version = "1.0.0"
description = "A modern Python workflow that finds and ranks top GitHub repositories for a configurable list of topics."
requires-python = ">=3.11"
authors = [
    { name = "Ghassen Ben Taher", email = "contact@bentaherghassen.com" }
]

[project.urls]
Homepage = "https://www.bentaherghassen.com"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]